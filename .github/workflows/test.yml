name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: unit tests (node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:unit

  browser:
    name: integration tests (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ubuntu-latest ships with Google Chrome pre-installed, exposed as `google-chrome`.
      - run: CHROME_BIN=$(which google-chrome) npm run test:browser
